name: SBOM & CBOM

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-boms:
    name: Generate SBOM and CBOM
    runs-on: ubuntu-latest
    env:
      ARMIS_CLIENT_ID: ${{ secrets.ARMIS_CLIENT_ID }}
      ARMIS_CLIENT_SECRET: ${{ secrets.ARMIS_CLIENT_SECRET }}
      ARMIS_NO_UPDATE_CHECK: "true"
      ARMIS_CLI_VERSION: "v1.22.0"
      ARMIS_CLI_SHA256: "b4d309663e9e0c393515d23f638008a0cf8408e8ac16208d93188ebd6f28840a"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Armis CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/armis-cli-linux-amd64.tar.gz"
          download_url="https://github.com/ArmisSecurity/armis-cli/releases/download/${ARMIS_CLI_VERSION}/armis-cli-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error "$download_url" --output "$archive"
          echo "$ARMIS_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/armis-cli"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/armis-cli"
          install -m 0755 "$RUNNER_TEMP/armis-cli/armis-cli" "$HOME/.local/bin/armis-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          armis-cli --version

      - name: Generate SBOM (Armis CLI)
        shell: bash
        run: |
          mkdir -p ci-boms
          # exit-code 0: this job only publishes artifacts. Severity gating on
          # scan findings is already enforced by security-gate-clean.yml and
          # security-gate-vulnerable.yml; it is not duplicated here.
          armis-cli scan repo . \
            --sbom \
            --sbom-format cyclonedx \
            --sbom-output ci-boms/sbom.cdx.json \
            --format json \
            --output ci-boms/armis-scan-results.json \
            --exit-code 0 \
            --no-progress \
            --no-update-check

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep crypto-detection rules
        run: |
          # No --error: these rules are inventory detection, not a pass/fail
          # gate, so a match must not fail the job.
          semgrep \
            --config .github/semgrep/crypto-rules.yml \
            --json \
            --output ci-boms/semgrep-crypto-results.json \
            --quiet \
            .

      - name: Generate CBOM from Semgrep findings
        run: |
          python .github/scripts/semgrep_to_cbom.py \
            --input ci-boms/semgrep-crypto-results.json \
            --output ci-boms/cbom.cdx.json \
            --repo-name myproj2 \
            --repo-version "1.0.0"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          with open(summary_path, "a") as s:
              s.write("### SBOM & CBOM\n\n")

              try:
                  with open("ci-boms/sbom.cdx.json") as f:
                      sbom = json.load(f)
                  s.write(f"- SBOM: {len(sbom.get('components', []))} component(s)\n")
              except FileNotFoundError:
                  s.write("- SBOM: not generated\n")

              try:
                  with open("ci-boms/cbom.cdx.json") as f:
                      cbom = json.load(f)
                  s.write(f"- CBOM: {len(cbom.get('components', []))} cryptographic asset(s)\n")
              except FileNotFoundError:
                  s.write("- CBOM: not generated\n")

              s.write("\nBoth files are attached to this run as the `boms` artifact.\n")
          PYEOF

      - name: Upload SBOM & CBOM artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boms
          path: |
            ci-boms/sbom.cdx.json
            ci-boms/cbom.cdx.json
          if-no-files-found: error
